[package]
name = "tgrab"
version = "0.1.0"
edition = "2024"
description = "Fast Telegram media archiver"

[package.metadata.bundle]
name = "tgrab"
identifier = "lk.tgrab.app"
icon = ["assets/icon.icns"]
short_description = "Fast Telegram media archiver"
osx_minimum_system_version = "11.0"
category = "public.app-category.utilities"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.37"
grammers-client = { version = "0.12", default-features = false }
grammers-session = { version = "0.12", default-features = false, features = ["sqlite-storage"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
open = "5"
qrcode = "0.14"
base64 = "0.22"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
